<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0b0f" />
    <title>NAN 2026 예선 빌드</title>
    <meta
      name="description"
      content="검 하나로 시작해 보스 드랍과 마을 장비 설정으로 양손 무기 조합을 확장하는 웹 기반 2D 탑다운 핵앤슬래시."
    />

    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="./icon-180.png" />

    <!--
      링크 미리보기. og:image만 절대 경로여야 한다. 대부분의 크롤러는 상대 경로를 해석하지 않는다.
      미리보기 그림에는 제목을 굽지 않았다. 제목이 아직 확정 전이라, 바뀌면 이미지를 다시 만들어야
      하기 때문이다. 이름은 og:title이 나른다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NAN 2026 예선 빌드" />
    <meta
      property="og:description"
      content="검 하나로 시작해 보스 드랍과 마을 장비 설정으로 양손 무기 조합을 확장하는 웹 기반 2D 탑다운 핵앤슬래시."
    />
    <meta property="og:url" content="https://8pril.github.io/nan2026-game/" />
    <meta property="og:image" content="https://8pril.github.io/nan2026-game/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0b0f;
        color: #e6e8ef;
        font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
          'Segoe UI', Roboto, sans-serif;
      }

      #game {
        width: 100%;
        height: 100%;
      }

      /* Phaser가 만든 캔버스는 Scale.FIT으로 중앙 정렬된다 */
      #game canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
