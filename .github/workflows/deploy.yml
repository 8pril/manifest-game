name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하지 않아
# 심사 기간에 링크가 잠시라도 비는 상황을 만들지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 액션 버전은 v5부터 Node 24에서 돈다. v4는 Node 20을 대상으로 만들어져
      # 러너가 강제로 24에서 실행하며 지원 종료 경고를 낸다.
      # 아래 node-version은 별개다. 우리 프로젝트를 빌드할 Node이고,
      # 개발 환경(20.20)과 맞춰 둔다.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # 타입 검사까지 포함된다. 타입 오류가 있으면 배포되지 않는다.
      - run: npm run build

      # composite 액션이라 자체 런타임은 없지만, 내부에서 부르는 upload-artifact가
      # v3에서는 Node 20짜리다. 경고에 나온 upload-artifact@v4가 이것이다.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
